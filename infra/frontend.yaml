AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  helmetduck.com static site: ACM certificate (DNS-validated in the hosted zone),
  private S3 origin, CloudFront with Origin Access Control, security headers with a
  strict CSP, an edge router (www to apex, directory index, honest 404), and Route 53
  alias records, access logs for the sentry, DNS hygiene records (CAA, MX, SPF, DMARC;
  WorkMail's records when a mailbox exists) and, when an alert email is given, a monthly budget alert and a request-flood
  alarm. Apply in us-east-1 only: CloudFront reads certificates from that region and
  from nowhere else.

# One stack, one environment (prod). The bucket is PRIVATE (all public access
# blocked) and readable only by this distribution through OAC. Deploys never
# delete: the deploy role has no s3:DeleteObject, and versioning keeps 90 days
# of rollback.
#
#   aws cloudformation deploy --template-file infra/frontend.yaml \
#     --stack-name helmet-duck-frontend-prod \
#     --parameter-overrides SiteDomain=helmetduck.com HostedZoneId=Z... \
#     --region us-east-1 --profile <admin profile>

Parameters:
  SiteDomain:
    Type: String
    Default: helmetduck.com
    Description: Apex domain. www.<SiteDomain> is also served and redirects to the apex.
  HostedZoneId:
    Type: String
    AllowedPattern: "^Z[A-Z0-9]+$"
    Description: Route 53 public hosted zone id for SiteDomain (certificate validation + alias records).
  Env:
    Type: String
    Default: prod
    AllowedValues: [prod]
  AlertEmail:
    Type: String
    Default: ""
    Description: >-
      Email for the monthly budget alert and the request-flood alarm. Empty creates
      neither. Supplied at apply time (HELMET_DUCK_ALERT_EMAIL); never committed.
  MonthlyBudgetUsd:
    Type: Number
    Default: 5
    MinValue: 1
    Description: Monthly cost budget for the whole account, in USD; alerts at 80% actual and 100% forecast.
  HourlyRequestAlarm:
    Type: Number
    Default: 100000
    MinValue: 1000
    Description: CloudFront requests in one hour that trip the flood alarm. A quiet new site sees a few hundred.

  MailProvider:
    Type: String
    Default: none
    AllowedValues: [none, workmail]
    Description: >-
      none: the zone says the domain sends and receives no mail (null MX, SPF fail-all).
      workmail: MX, SPF, verification, DKIM and autodiscover records for the Amazon WorkMail
      organization. tools/apply.sh detects the organization and fills the values below.
  WorkMailMx:
    Type: String
    Default: "10 inbound-smtp.us-east-1.amazonaws.com."
  WorkMailAutodiscover:
    Type: String
    Default: "autodiscover.mail.us-east-1.awsapps.com."
  WorkMailVerificationToken:
    Type: String
    Default: ""
  WorkMailDkimToken1:
    Type: String
    Default: ""
  WorkMailDkimToken2:
    Type: String
    Default: ""
  WorkMailDkimToken3:
    Type: String
    Default: ""

Conditions:
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, ""]]
  HasWorkMail: !Equals [!Ref MailProvider, workmail]

Resources:

  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref SiteDomain
      SubjectAlternativeNames:
        - !Sub "www.${SiteDomain}"
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref SiteDomain
          HostedZoneId: !Ref HostedZoneId
        - DomainName: !Sub "www.${SiteDomain}"
          HostedZoneId: !Ref HostedZoneId
      Tags:
        - { Key: Project, Value: helmet-duck }
        - { Key: Environment, Value: !Ref Env }
        - { Key: ManagedBy, Value: cloudformation }

  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "helmet-duck-${Env}-site-${AWS::AccountId}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-versions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 90
      Tags:
        - { Key: Project, Value: helmet-duck }
        - { Key: Environment, Value: !Ref Env }
        - { Key: ManagedBy, Value: cloudformation }

  # Access logs: the sentry's raw material. CloudFront's standard logging writes
  # through an ACL grant, so this bucket keeps ACLs enabled (BucketOwnerPreferred)
  # while every public grant stays blocked. Logs expire after 90 days. Only the
  # read-only sentry role (infra/github-oidc.yaml) and the account read them.
  LogBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "helmet-duck-${Env}-logs-${AWS::AccountId}"
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerPreferred
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: expire-logs
            Status: Enabled
            ExpirationInDays: 90
          - Id: abort-incomplete-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      Tags:
        - { Key: Project, Value: helmet-duck }
        - { Key: Environment, Value: !Ref Env }
        - { Key: ManagedBy, Value: cloudformation }

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "helmet-duck-${Env}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # The page ships no JavaScript and no third-party assets, so the policy can be
  # strict. If a script or an external resource is ever added, this is the line
  # that must change first, deliberately.
  SecurityHeaders:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "helmet-duck-${Env}-security-headers"
        Comment: Strict headers for a static, script-free site.
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            ContentSecurityPolicy: "default-src 'none'; style-src 'self'; img-src 'self' data:; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests"
            Override: true
          ContentTypeOptions: { Override: true }
          FrameOptions: { FrameOption: DENY, Override: true }
          ReferrerPolicy: { ReferrerPolicy: strict-origin-when-cross-origin, Override: true }
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Preload: true
            Override: true
        CustomHeadersConfig:
          Items:
            - Header: Permissions-Policy
              Value: "geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=()"
              Override: true

  # www -> apex (301), directory index, and an honest 404 for unknown routes:
  # an extensionless path becomes <path>/index.html and 404s if absent. It is
  # never masked to the home page.
  EdgeRouter:
    Type: AWS::CloudFront::Function
    Properties:
      AutoPublish: true
      Name: !Sub "helmet-duck-${Env}-edge-router"
      FunctionConfig:
        Comment: www to apex, directory index, honest 404.
        Runtime: cloudfront-js-2.0
      FunctionCode: !Sub |
        function handler(event) {
          var request = event.request;
          var host = request.headers.host ? request.headers.host.value : '';
          var uri = request.uri;
          if (host === 'www.${SiteDomain}') {
            return { statusCode: 301, statusDescription: 'Moved Permanently',
                     headers: { location: { value: 'https://${SiteDomain}' + uri } } };
          }
          if (uri.endsWith('/')) {
            request.uri = uri + 'index.html';
          } else if (!uri.split('/').pop().includes('.')) {
            request.uri = uri + '/index.html';
          }
          return request;
        }

  Distribution:
    Type: AWS::CloudFront::Distribution
    DependsOn: Certificate
    Properties:
      DistributionConfig:
        Comment: !Sub "helmet-duck ${Env} (${SiteDomain})"
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_All
        IPV6Enabled: true
        Logging:
          Bucket: !GetAtt LogBucket.DomainName
          Prefix: cloudfront/
          IncludeCookies: false
        Aliases:
          - !Ref SiteDomain
          - !Sub "www.${SiteDomain}"
        Origins:
          - Id: s3origin
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !Ref OriginAccessControl
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: s3origin
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6   # AWS managed CachingOptimized
          ResponseHeadersPolicyId: !Ref SecurityHeaders
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt EdgeRouter.FunctionARN
        CustomErrorResponses:
          # A private bucket answers 403 for a missing key. Both become an honest
          # 404 page with a 404 status, never a masked home page.
          - { ErrorCode: 403, ResponseCode: 404, ResponsePagePath: /404.html, ErrorCachingMinTTL: 0 }
          - { ErrorCode: 404, ResponseCode: 404, ResponsePagePath: /404.html, ErrorCachingMinTTL: 0 }
        ViewerCertificate:
          AcmCertificateArn: !Ref Certificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
      Tags:
        - { Key: Project, Value: helmet-duck }
        - { Key: Environment, Value: !Ref Env }

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontOACRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  # Z2FDTNDATAQYW2 is CloudFront's fixed alias hosted-zone id, the same for every distribution.
  ApexA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref SiteDomain
      Type: A
      AliasTarget: { DNSName: !GetAtt Distribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2, EvaluateTargetHealth: false }
  ApexAAAA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref SiteDomain
      Type: AAAA
      AliasTarget: { DNSName: !GetAtt Distribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2, EvaluateTargetHealth: false }
  WwwA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub "www.${SiteDomain}"
      Type: A
      AliasTarget: { DNSName: !GetAtt Distribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2, EvaluateTargetHealth: false }
  WwwAAAA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub "www.${SiteDomain}"
      Type: AAAA
      AliasTarget: { DNSName: !GetAtt Distribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2, EvaluateTargetHealth: false }

  # Certificate authority authorization: only Amazon's CAs may issue for this name.
  ApexCAA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref SiteDomain
      Type: CAA
      TTL: "3600"
      ResourceRecords:
        - '0 issue "amazon.com"'
        - '0 issue "amazontrust.com"'
        - '0 issue "awstrust.com"'
        - '0 issue "amazonaws.com"'

  # Mail. With MailProvider=none the zone says the domain sends and receives no
  # mail, so nobody can send mail as it: a null MX, an SPF that fails every sender,
  # a DMARC that rejects. With MailProvider=workmail the MX and SPF point at Amazon
  # WorkMail (which sends through amazonses.com), and the verification, DKIM and
  # autodiscover records below are created. DMARC stays at reject in both cases:
  # WorkMail signs with DKIM aligned to this domain, which is what DMARC needs.
  ApexMX:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref SiteDomain
      Type: MX
      TTL: "3600"
      ResourceRecords:
        - !If [HasWorkMail, !Ref WorkMailMx, "0 ."]
  ApexTXT:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref SiteDomain
      Type: TXT
      TTL: "3600"
      ResourceRecords:
        - !If [HasWorkMail, '"v=spf1 include:amazonses.com -all"', '"v=spf1 -all"']
  MailVerification:
    Type: AWS::Route53::RecordSet
    Condition: HasWorkMail
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub "_amazonses.${SiteDomain}"
      Type: TXT
      TTL: "3600"
      ResourceRecords:
        - !Sub '"${WorkMailVerificationToken}"'
  MailAutodiscover:
    Type: AWS::Route53::RecordSet
    Condition: HasWorkMail
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub "autodiscover.${SiteDomain}"
      Type: CNAME
      TTL: "3600"
      ResourceRecords:
        - !Ref WorkMailAutodiscover
  MailDkim1:
    Type: AWS::Route53::RecordSet
    Condition: HasWorkMail
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub "${WorkMailDkimToken1}._domainkey.${SiteDomain}"
      Type: CNAME
      TTL: "3600"
      ResourceRecords:
        - !Sub "${WorkMailDkimToken1}.dkim.amazonses.com"
  MailDkim2:
    Type: AWS::Route53::RecordSet
    Condition: HasWorkMail
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub "${WorkMailDkimToken2}._domainkey.${SiteDomain}"
      Type: CNAME
      TTL: "3600"
      ResourceRecords:
        - !Sub "${WorkMailDkimToken2}.dkim.amazonses.com"
  MailDkim3:
    Type: AWS::Route53::RecordSet
    Condition: HasWorkMail
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub "${WorkMailDkimToken3}._domainkey.${SiteDomain}"
      Type: CNAME
      TTL: "3600"
      ResourceRecords:
        - !Sub "${WorkMailDkimToken3}.dkim.amazonses.com"
  DmarcTXT:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub "_dmarc.${SiteDomain}"
      Type: TXT
      TTL: "3600"
      ResourceRecords:
        - '"v=DMARC1; p=reject; sp=reject; adkim=s; aspf=s"'

  # Money watch, created only when an alert email is given. The budget is free
  # (the first two budgets in an account are). The alarm is the one paid line in
  # this template: about 0.10 USD a month.
  AlertTopic:
    Type: AWS::SNS::Topic
    Condition: HasAlertEmail
    Properties:
      TopicName: !Sub "helmet-duck-${Env}-alerts"
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlertEmail
  RequestFloodAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasAlertEmail
    Properties:
      AlarmName: !Sub "helmet-duck-${Env}-request-flood"
      AlarmDescription: More CloudFront requests in one hour than a quiet static site should see. A cost attack or a viral hour; look, then decide.
      Namespace: AWS/CloudFront
      MetricName: Requests
      Dimensions:
        - { Name: DistributionId, Value: !Ref Distribution }
        - { Name: Region, Value: Global }
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: !Ref HourlyRequestAlarm
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic
  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Condition: HasAlertEmail
    Properties:
      Budget:
        BudgetName: !Sub "helmet-duck-${Env}-monthly"
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref MonthlyBudgetUsd
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - { SubscriptionType: EMAIL, Address: !Ref AlertEmail }
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - { SubscriptionType: EMAIL, Address: !Ref AlertEmail }

Outputs:
  BucketName:
    Description: GitHub environment variable SITE_BUCKET.
    Value: !Ref SiteBucket
  DistributionId:
    Description: GitHub environment variable CLOUDFRONT_DISTRIBUTION_ID; parameter for infra/github-oidc.yaml.
    Value: !Ref Distribution
  DistributionDomainName:
    Description: The default CloudFront domain, useful for a check that bypasses DNS.
    Value: !GetAtt Distribution.DomainName
  CertificateArn:
    Value: !Ref Certificate
  SiteUrl:
    Value: !Sub "https://${SiteDomain}/"
  LogBucketName:
    Description: Access-log bucket; parameter LogBucketName for infra/github-oidc.yaml and variable LOG_BUCKET of the sentry Environment.
    Value: !Ref LogBucket
  AlertTopicArn:
    Condition: HasAlertEmail
    Value: !Ref AlertTopic
