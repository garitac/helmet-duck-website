AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  helmetduck.com static site: ACM certificate (DNS-validated in the hosted zone),
  private S3 origin, CloudFront with Origin Access Control, security headers with a
  strict CSP, an edge router (www to apex, directory index, honest 404), and Route 53
  alias records, access logs for the sentry, DNS hygiene records (CAA, MX, SPF, DMARC;
  pointing at SES when infra/mail.yaml is applied) and, when an alert email is given, a monthly budget alert and a request-flood
  alarm, a brake that disables the distribution while a flood lasts, and an edge blocklist
  that refuses flooding addresses before any bandwidth is spent. Apply in us-east-1 only: CloudFront reads certificates from that region and
  from nowhere else.

# One stack, one environment (prod). The bucket is PRIVATE (all public access
# blocked) and readable only by this distribution through OAC. Deploys never
# delete: the deploy role has no s3:DeleteObject, and versioning keeps 90 days
# of rollback.
#
#   aws cloudformation deploy --template-file infra/frontend.yaml \
#     --stack-name helmet-duck-frontend-prod \
#     --parameter-overrides SiteDomain=helmetduck.com HostedZoneId=Z... \
#     --region us-east-1 --profile <admin profile>

Parameters:
  SiteDomain:
    Type: String
    Default: helmetduck.com
    Description: Apex domain. www.<SiteDomain> is also served and redirects to the apex.
  HostedZoneId:
    Type: String
    AllowedPattern: "^Z[A-Z0-9]+$"
    Description: Route 53 public hosted zone id for SiteDomain (certificate validation + alias records).
  Env:
    Type: String
    Default: prod
    AllowedValues: [prod]
  AlertEmail:
    Type: String
    Default: ""
    Description: >-
      Email for the monthly budget alert and the request-flood alarm. Empty creates
      neither. Supplied at apply time (HELMET_DUCK_ALERT_EMAIL); never committed.
  MonthlyBudgetUsd:
    Type: Number
    Default: 5
    MinValue: 1
    Description: Monthly cost budget for the whole account, in USD; alerts at 80% actual and 100% forecast.
  HourlyRequestAlarm:
    Type: Number
    Default: 100000
    MinValue: 1000
    Description: CloudFront requests in one hour that trip the flood alarm. A quiet new site sees a few hundred.

  MailProvider:
    Type: String
    Default: none
    AllowedValues: [none, ses]
    Description: >-
      none: the zone says the domain sends and receives no mail (null MX, SPF fail-all).
      ses: the apex MX and SPF point at Amazon SES; the identity, DKIM, MAIL FROM records,
      receipt rule and forwarder live in infra/mail.yaml. tools/apply.sh sets this.

  BlockAt:
    Type: Number
    Default: 50
    MinValue: 50
    Description: More than this many requests from one address in a rolling five minutes triggers a temporary block after logs arrive. Counts combine files; HTTP 429 and duplicate requests are excluded.

Conditions:
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, ""]]
  HasMail: !Equals [!Ref MailProvider, ses]

Resources:

  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref SiteDomain
      SubjectAlternativeNames:
        - !Sub "www.${SiteDomain}"
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref SiteDomain
          HostedZoneId: !Ref HostedZoneId
        - DomainName: !Sub "www.${SiteDomain}"
          HostedZoneId: !Ref HostedZoneId
      Tags:
        - { Key: Project, Value: helmet-duck }
        - { Key: Environment, Value: !Ref Env }
        - { Key: ManagedBy, Value: cloudformation }

  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "helmet-duck-${Env}-site-${AWS::AccountId}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-versions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 90
      Tags:
        - { Key: Project, Value: helmet-duck }
        - { Key: Environment, Value: !Ref Env }
        - { Key: ManagedBy, Value: cloudformation }

  # Access logs: the sentry's raw material. CloudFront's standard logging writes
  # through an ACL grant, so this bucket keeps ACLs enabled (BucketOwnerPreferred)
  # while every public grant stays blocked. Logs expire after 90 days. Only the
  # read-only sentry role (infra/github-oidc.yaml) and the account read them.
  LogBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "helmet-duck-${Env}-logs-${AWS::AccountId}"
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerPreferred
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      NotificationConfiguration:
        EventBridgeConfiguration:
          EventBridgeEnabled: true       # each delivered log file wakes the blocklist keeper
      LifecycleConfiguration:
        Rules:
          - Id: expire-logs
            Status: Enabled
            ExpirationInDays: 90
          - Id: abort-incomplete-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      Tags:
        - { Key: Project, Value: helmet-duck }
        - { Key: Environment, Value: !Ref Env }
        - { Key: ManagedBy, Value: cloudformation }

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "helmet-duck-${Env}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # The page ships no JavaScript and no third-party assets, so the policy can be
  # strict. If a script or an external resource is ever added, this is the line
  # that must change first, deliberately.
  SecurityHeaders:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "helmet-duck-${Env}-security-headers"
        Comment: Strict headers for a static, script-free site.
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            ContentSecurityPolicy: "default-src 'none'; style-src 'self'; img-src 'self' data:; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests"
            Override: true
          ContentTypeOptions: { Override: true }
          FrameOptions: { FrameOption: DENY, Override: true }
          ReferrerPolicy: { ReferrerPolicy: strict-origin-when-cross-origin, Override: true }
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Preload: true
            Override: true
        CustomHeadersConfig:
          Items:
            - Header: Permissions-Policy
              Value: "geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=()"
              Override: true

  # First the blocklist: addresses the keeper below has written between the
  # markers are refused with 429 before a byte of the site is served. Then
  # www -> apex (301), directory index, and an honest 404 for unknown routes:
  # an extensionless path becomes <path>/index.html and 404s if absent. It is
  # never masked to the home page.
  EdgeRouter:
    Type: AWS::CloudFront::Function
    Properties:
      AutoPublish: true
      Name: !Sub "helmet-duck-${Env}-edge-router"
      FunctionConfig:
        Comment: www to apex, directory index, honest 404.
        Runtime: cloudfront-js-2.0
      FunctionCode: !Sub |
        function handler(event) {
          var request = event.request;
          var blocked = /*BLOCKLIST*/{}/*END*/;
          var until = blocked[event.viewer.ip];
          if (until && until > Date.now() / 1000) {
            return { statusCode: 429, statusDescription: 'Too Many Requests',
                     headers: { 'cache-control': { value: 'no-store' }, 'retry-after': { value: '3600' } } };
          }
          var host = request.headers.host ? request.headers.host.value : '';
          var uri = request.uri;
          if (host === 'www.${SiteDomain}') {
            return { statusCode: 301, statusDescription: 'Moved Permanently',
                     headers: { location: { value: 'https://${SiteDomain}' + uri } } };
          }
          if (uri.endsWith('/')) {
            request.uri = uri + 'index.html';
          } else if (!uri.split('/').pop().includes('.')) {
            request.uri = uri + '/index.html';
          }
          return request;
        }

  Distribution:
    Type: AWS::CloudFront::Distribution
    DependsOn: Certificate
    Properties:
      DistributionConfig:
        Comment: !Sub "helmet-duck ${Env} (${SiteDomain})"
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_All
        IPV6Enabled: true
        Logging:
          Bucket: !GetAtt LogBucket.DomainName
          Prefix: cloudfront/
          IncludeCookies: false
        Aliases:
          - !Ref SiteDomain
          - !Sub "www.${SiteDomain}"
        Origins:
          - Id: s3origin
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !Ref OriginAccessControl
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: s3origin
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6   # AWS managed CachingOptimized
          ResponseHeadersPolicyId: !Ref SecurityHeaders
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt EdgeRouter.FunctionARN
        CustomErrorResponses:
          # A private bucket answers 403 for a missing key. Both become an honest
          # 404 page with a 404 status, never a masked home page.
          - { ErrorCode: 403, ResponseCode: 404, ResponsePagePath: /404.html, ErrorCachingMinTTL: 0 }
          - { ErrorCode: 404, ResponseCode: 404, ResponsePagePath: /404.html, ErrorCachingMinTTL: 0 }
        ViewerCertificate:
          AcmCertificateArn: !Ref Certificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
      Tags:
        - { Key: Project, Value: helmet-duck }
        - { Key: Environment, Value: !Ref Env }

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontOACRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  # Z2FDTNDATAQYW2 is CloudFront's fixed alias hosted-zone id, the same for every distribution.
  ApexA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref SiteDomain
      Type: A
      AliasTarget: { DNSName: !GetAtt Distribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2, EvaluateTargetHealth: false }
  ApexAAAA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref SiteDomain
      Type: AAAA
      AliasTarget: { DNSName: !GetAtt Distribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2, EvaluateTargetHealth: false }
  WwwA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub "www.${SiteDomain}"
      Type: A
      AliasTarget: { DNSName: !GetAtt Distribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2, EvaluateTargetHealth: false }
  WwwAAAA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub "www.${SiteDomain}"
      Type: AAAA
      AliasTarget: { DNSName: !GetAtt Distribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2, EvaluateTargetHealth: false }

  # Certificate authority authorization: only Amazon's CAs may issue for this name.
  ApexCAA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref SiteDomain
      Type: CAA
      TTL: "3600"
      ResourceRecords:
        - '0 issue "amazon.com"'
        - '0 issue "amazontrust.com"'
        - '0 issue "awstrust.com"'
        - '0 issue "amazonaws.com"'

  # Mail. With MailProvider=none the zone says the domain sends and receives no
  # mail, so nobody can send mail as it: a null MX, an SPF that fails every sender,
  # a DMARC that rejects. With MailProvider=ses the MX and SPF point at Amazon SES,
  # whose identity, DKIM and MAIL FROM records are created by infra/mail.yaml. DMARC
  # stays at reject in both cases: SES signs with DKIM aligned to this domain and the
  # MAIL FROM subdomain aligns SPF, which is what DMARC needs.
  ApexMX:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref SiteDomain
      Type: MX
      TTL: "3600"
      ResourceRecords:
        - !If [HasMail, !Sub "10 inbound-smtp.${AWS::Region}.amazonaws.com.", "0 ."]
  ApexTXT:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref SiteDomain
      Type: TXT
      TTL: "3600"
      ResourceRecords:
        - !If [HasMail, '"v=spf1 include:amazonses.com -all"', '"v=spf1 -all"']
  DmarcTXT:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub "_dmarc.${SiteDomain}"
      Type: TXT
      TTL: "3600"
      ResourceRecords:
        - '"v=DMARC1; p=reject; sp=reject; adkim=s; aspf=s"'
  # Money watch, created only when an alert email is given. The budget is free
  # (the first two budgets in an account are). The alarm is the one paid line in
  # this template: about 0.10 USD a month.
  AlertTopic:
    Type: AWS::SNS::Topic
    Condition: HasAlertEmail
    Properties:
      TopicName: !Sub "helmet-duck-${Env}-alerts"
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlertEmail
  RequestFloodAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasAlertEmail
    Properties:
      AlarmName: !Sub "helmet-duck-${Env}-request-flood"
      AlarmDescription: More CloudFront requests in one hour than a quiet static site should see. A cost attack or a viral hour; look, then decide.
      Namespace: AWS/CloudFront
      MetricName: Requests
      Dimensions:
        - { Name: DistributionId, Value: !Ref Distribution }
        - { Name: Region, Value: Global }
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: !Ref HourlyRequestAlarm
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic
  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Condition: HasAlertEmail
    Properties:
      # No fixed BudgetName: changing a subscriber replaces the budget, and a replacement
      # with a fixed name collides with the one it replaces. CloudFormation names it.
      Budget:
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref MonthlyBudgetUsd
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - { SubscriptionType: EMAIL, Address: !Ref AlertEmail }
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - { SubscriptionType: EMAIL, Address: !Ref AlertEmail }

  # The brake. When the flood alarm fires, this function disables the distribution
  # and waits: an hour the first time, twice as long each repeat, a day at most,
  # resetting after a quiet day. A scheduled tick re-enables it when the wait is
  # over. It bounds the bill; it does not keep the site up. The owner can release
  # it early or switch it off: tools/brake.sh. Free at this volume.
  BrakeState:
    Type: AWS::SSM::Parameter
    Condition: HasAlertEmail
    Properties:
      Name: !Sub "/helmet-duck/${Env}/brake"
      Type: String
      Value: '{"count": 0}'
      Description: helmet-duck brake state (count, last_alarm, until, off). Written by the brake function and tools/brake.sh.
  BrakeRole:
    Type: AWS::IAM::Role
    Condition: HasAlertEmail
    Properties:
      Description: The brake may read and toggle this one distribution, keep its state, and notify the alert topic.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: brake
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - cloudfront:GetDistributionConfig
                  - cloudfront:UpdateDistribution
                Resource: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:PutParameter
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/helmet-duck/${Env}/brake"
              - Effect: Allow
                Action: sns:Publish
                Resource: !Ref AlertTopic
  Brake:
    Type: AWS::Lambda::Function
    Condition: HasAlertEmail
    Properties:
      Description: Disables the helmetduck.com distribution when the flood alarm fires; re-enables it after a growing wait.
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt BrakeRole.Arn
      Timeout: 30
      MemorySize: 128
      Environment:
        Variables:
          DISTRIBUTION_ID: !Ref Distribution
          PARAM: !Sub "/helmet-duck/${Env}/brake"
          TOPIC: !Ref AlertTopic
          ALARM_NAME: !Sub "helmet-duck-${Env}-request-flood"
      Code:
        ZipFile: |
          import json, os, time
          import boto3
          cf, ssm, sns = boto3.client("cloudfront"), boto3.client("ssm"), boto3.client("sns")
          DIST, PARAM, TOPIC, ALARM = (os.environ[k] for k in ("DISTRIBUTION_ID", "PARAM", "TOPIC", "ALARM_NAME"))
          BASE, CAP, QUIET = 3600, 86400, 86400

          def state():
              try:
                  return json.loads(ssm.get_parameter(Name=PARAM)["Parameter"]["Value"])
              except Exception:
                  return {}

          def save(s):
              ssm.put_parameter(Name=PARAM, Value=json.dumps(s), Type="String", Overwrite=True)

          def set_enabled(on):
              r = cf.get_distribution_config(Id=DIST)
              cfg = r["DistributionConfig"]
              if cfg["Enabled"] == on:
                  return False
              cfg["Enabled"] = on
              cf.update_distribution(Id=DIST, IfMatch=r["ETag"], DistributionConfig=cfg)
              return True

          def say(subject, body):
              sns.publish(TopicArn=TOPIC, Subject=subject[:99], Message=body)

          def when(ts):
              return time.strftime("%Y-%m-%d %H:%M UTC", time.gmtime(ts))

          def handler(event, _):
              now = int(time.time())
              s = state()
              if s.get("off"):
                  print("brake switched off by the owner; nothing done")
                  return
              for rec in event.get("Records", []):
                  try:
                      m = json.loads(rec["Sns"]["Message"])
                  except Exception:
                      continue
                  if m.get("AlarmName") != ALARM or m.get("NewStateValue") != "ALARM":
                      continue
                  if now - s.get("last_alarm", 0) > QUIET:
                      s["count"] = 0
                  s["count"] = s.get("count", 0) + 1
                  s["last_alarm"] = now
                  wait = min(BASE * 2 ** (s["count"] - 1), CAP)
                  s["until"] = now + wait
                  changed = set_enabled(False)
                  save(s)
                  say("helmet-duck brake engaged", "The flood alarm fired (%d in a row). Distribution %s is disabled for %d minutes, until %s. Release early with tools/brake.sh release." % (s["count"], DIST, wait // 60, when(s["until"])))
                  print(json.dumps({"brake": "engaged", "count": s["count"], "until": s["until"], "changed": changed}))
                  return
              if event.get("tick") and s.get("until") and now >= s["until"]:
                  changed = set_enabled(True)
                  s["until"] = 0
                  save(s)
                  if changed:
                      say("helmet-duck brake released", "Distribution %s is enabled again at %s. If the flood continues the alarm fires again and the next wait is longer (%d in a row so far)." % (DIST, when(now), s.get("count", 0)))
                  print(json.dumps({"brake": "released", "changed": changed}))
  BrakeFromTopic:
    Type: AWS::Lambda::Permission
    Condition: HasAlertEmail
    Properties:
      FunctionName: !Ref Brake
      Action: lambda:InvokeFunction
      Principal: sns.amazonaws.com
      SourceArn: !Ref AlertTopic
  BrakeSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      TopicArn: !Ref AlertTopic
      Protocol: lambda
      Endpoint: !GetAtt Brake.Arn
  BrakeTick:
    Type: AWS::Events::Rule
    Condition: HasAlertEmail
    Properties:
      Description: Every fifteen minutes the brake checks whether its wait is over.
      ScheduleExpression: rate(15 minutes)
      State: ENABLED
      Targets:
        - Id: brake
          Arn: !GetAtt Brake.Arn
          Input: '{"tick": true}'
  BrakeFromTick:
    Type: AWS::Lambda::Permission
    Condition: HasAlertEmail
    Properties:
      FunctionName: !Ref Brake
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt BrakeTick.Arn

  # The keeper combines event-time windows across log files in eight fixed,
  # FREE Standard parameters. Never enable Parameter Store higher throughput or
  # Advanced tier for this feature. Reserved concurrency serializes state writes.
  KeeperState0:
    Type: AWS::SSM::Parameter
    Condition: HasAlertEmail
    Properties:
      Name: !Sub "/helmet-duck/${Env}/keeper/state/0"
      Type: String
      Tier: Standard
      Value: "{}"
      Description: Free bounded keeper state; do not reset during routine updates.

  KeeperState1:
    Type: AWS::SSM::Parameter
    Condition: HasAlertEmail
    Properties:
      Name: !Sub "/helmet-duck/${Env}/keeper/state/1"
      Type: String
      Tier: Standard
      Value: "{}"
      Description: Free bounded keeper state; do not reset during routine updates.

  KeeperState2:
    Type: AWS::SSM::Parameter
    Condition: HasAlertEmail
    Properties:
      Name: !Sub "/helmet-duck/${Env}/keeper/state/2"
      Type: String
      Tier: Standard
      Value: "{}"
      Description: Free bounded keeper state; do not reset during routine updates.

  KeeperState3:
    Type: AWS::SSM::Parameter
    Condition: HasAlertEmail
    Properties:
      Name: !Sub "/helmet-duck/${Env}/keeper/state/3"
      Type: String
      Tier: Standard
      Value: "{}"
      Description: Free bounded keeper state; do not reset during routine updates.

  KeeperState4:
    Type: AWS::SSM::Parameter
    Condition: HasAlertEmail
    Properties:
      Name: !Sub "/helmet-duck/${Env}/keeper/state/4"
      Type: String
      Tier: Standard
      Value: "{}"
      Description: Free bounded keeper state; do not reset during routine updates.

  KeeperState5:
    Type: AWS::SSM::Parameter
    Condition: HasAlertEmail
    Properties:
      Name: !Sub "/helmet-duck/${Env}/keeper/state/5"
      Type: String
      Tier: Standard
      Value: "{}"
      Description: Free bounded keeper state; do not reset during routine updates.

  KeeperState6:
    Type: AWS::SSM::Parameter
    Condition: HasAlertEmail
    Properties:
      Name: !Sub "/helmet-duck/${Env}/keeper/state/6"
      Type: String
      Tier: Standard
      Value: "{}"
      Description: Free bounded keeper state; do not reset during routine updates.

  KeeperState7:
    Type: AWS::SSM::Parameter
    Condition: HasAlertEmail
    Properties:
      Name: !Sub "/helmet-duck/${Env}/keeper/state/7"
      Type: String
      Tier: Standard
      Value: "{}"
      Description: Free bounded keeper state; do not reset during routine updates.

  KeeperRole:
    Type: AWS::IAM::Role
    Condition: HasAlertEmail
    Properties:
      Description: The blocklist keeper may read access logs, rewrite and publish the edge function, and notify the alert topic.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: keeper
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "${LogBucket.Arn}/cloudfront/*"
              - Effect: Allow
                Action:
                  - cloudfront:GetFunction
                  - cloudfront:DescribeFunction
                  - cloudfront:UpdateFunction
                  - cloudfront:PublishFunction
                Resource: !Sub "arn:aws:cloudfront::${AWS::AccountId}:function/helmet-duck-${Env}-edge-router"
              - Effect: Allow
                Action: [ssm:GetParameters, ssm:PutParameter]
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/helmet-duck/${Env}/keeper/state/*"
              - Effect: Allow
                Action: sns:Publish
                Resource: !Ref AlertTopic
  Keeper:
    Type: AWS::Lambda::Function
    Condition: HasAlertEmail
    DependsOn: [KeeperState0, KeeperState1, KeeperState2, KeeperState3, KeeperState4, KeeperState5, KeeperState6, KeeperState7]
    Properties:
      Description: Reads each new access-log file and writes flooding addresses into the edge function's blocklist.
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt KeeperRole.Arn
      ReservedConcurrentExecutions: 1
      Timeout: 60
      MemorySize: 256
      Environment:
        Variables:
          FUNCTION_NAME: !Sub "helmet-duck-${Env}-edge-router"
          TOPIC: !Ref AlertTopic
          BLOCK_AT: !Ref BlockAt
          STATE_PREFIX: !Sub "/helmet-duck/${Env}/keeper/state/"
      Code:
        ZipFile: |
          """Log-delivery-driven IP blocking; no per-viewer AWS calls or paid state store.

          Embedded in frontend.yaml by tools/render_keeper.py. Standard parameters only,
          standard throughput, and one Lambda execution at a time. Never log raw IPs.
          """
          import base64
          import collections
          import datetime
          import gzip
          import hashlib
          import ipaddress
          import json
          import os
          import re
          import time
          import zlib

          import boto3

          s3, cf, sns, ssm = (boto3.client(s) for s in ('s3', 'cloudfront', 'sns', 'ssm'))
          FN, TOPIC = os.environ['FUNCTION_NAME'], os.environ['TOPIC']
          PREFIX = os.environ['STATE_PREFIX']
          LIMIT = int(os.environ.get('BLOCK_AT', '50'))
          WINDOW = 300
          FRESH = 3600  # Ignore evidence older than an hour, rather than punish a later visitor.
          FIRST, REPEAT = 3600, 86400
          SHARDS = 8
          MARK = re.compile(r'/\*BLOCKLIST\*/(.*?)/\*END\*/', re.S)


          def stamp(ts):
              return datetime.datetime.fromtimestamp(ts, datetime.timezone.utc).isoformat()


          def digest(value):
              return hashlib.sha256(value.encode()).hexdigest()[:16]


          def safe_path(value):
              # Treat client strings as untrusted data. No queries, control characters or URLs.
              return re.sub(r'[^a-zA-Z0-9/_.-]', '_', value.split('?', 1)[0])[:80]


          def records(raw, now):
              fields, result, total = None, {}, 0
              for line in raw.splitlines():
                  if line.startswith('#Fields:'):
                      fields = line.split(':', 1)[1].split()
                  elif fields and not line.startswith('#'):
                      cells = line.split('\t')
                      if len(cells) < len(fields):
                          continue
                      row = dict(zip(fields, cells))
                      total += 1
                      try:
                          ip = str(ipaddress.ip_address(row['c-ip']))
                          ts = int(datetime.datetime.fromisoformat(row['date'] + 'T' + row['time'])
                                   .replace(tzinfo=datetime.timezone.utc).timestamp())
                          status = int(row['sc-status'])
                      except (ValueError, KeyError):
                          continue
                      if not now - FRESH <= ts <= now + 60 or status == 429:
                          continue
                      # CloudFront request IDs distinguish actual requests from redelivery.
                      # The fallback supports older/synthetic logs without inventing counts.
                      rid = row.get('x-edge-request-id', '-')
                      rid = digest(ip + ':' + (rid if rid != '-' else line))
                      result.setdefault(ip, {})[rid] = [ts, rid, status, safe_path(row['cs-uri-stem'])]
              return result, total


          def peak_window(rows):
              ordered = sorted(rows, key=lambda r: (r[0], r[1]))
              left, best_left, best_right = 0, 0, 0
              for right, row in enumerate(ordered):
                  while row[0] - ordered[left][0] > WINDOW:
                      left += 1
                  if right - left + 1 > best_right - best_left:
                      best_left, best_right = left, right + 1
              return ordered[best_left:best_right]


          def decide(state, incoming, now):
              """Pure event-time policy: deduplicate, combine files, never extend active bans."""
              for ip in list(state):
                  entry = state[ip]
                  entry['r'] = [r for r in entry.get('r', []) if r[0] >= now - FRESH]
                  if not entry['r'] and entry.get('until', 0) < now - REPEAT and not entry.get('pending'):
                      del state[ip]
              for ip, new in incoming.items():
                  entry = state.setdefault(ip, {'r': []})
                  until = entry.get('until', 0)
                  if until > now or entry.get('pending'):
                      continue
                  # A repeat must be fresh traffic AFTER the preceding ban, not delayed logs.
                  merged = {r[1]: r for r in entry['r'] if r[0] > until}
                  merged.update({k: r for k, r in new.items() if r[0] > until})
                  entry['r'] = list(merged.values())
                  peak = peak_window(entry['r'])
                  if len(peak) <= LIMIT:
                      continue
                  duration = REPEAT if until >= now - REPEAT else FIRST
                  entry.update(until=now + duration, pending=True, r=[], detail={
                      'address_hash': digest(ip), 'requests': len(peak),
                      'first_utc': stamp(peak[0][0]), 'last_utc': stamp(peak[-1][0]),
                      'statuses': dict(collections.Counter(str(r[2]) for r in peak)),
                      'path_samples': list(dict.fromkeys(r[3] for r in peak))[:5],
                      'expires_utc': stamp(now + duration), 'seconds': duration,
                  })
              return state


          def pack(state):
              return base64.b64encode(zlib.compress(json.dumps(state, separators=(',', ':')).encode())).decode()


          def unpack(value):
              return {} if value == '{}' else json.loads(zlib.decompress(base64.b64decode(value)))


          def shard(ip):
              return int(digest(ip), 16) % SHARDS


          def bounded(state):
              """Stay in the FREE 4 KB Standard tier. Never evict a ban or pending alert."""
              dropped = 0
              while len(pack(state)) > 4096:
                  candidates = [(r[0], ip, i) for ip, e in state.items() for i, r in enumerate(e.get('r', []))]
                  if not candidates:
                      raise RuntimeError('Keeper Standard state capacity exhausted; existing edge bans preserved')
                  _, ip, i = min(candidates)
                  del state[ip]['r'][i]
                  dropped += 1
                  if not state[ip]['r'] and not state[ip].get('until'):
                      del state[ip]
              return dropped


          def read_state():
              names = [PREFIX + str(i) for i in range(SHARDS)]
              got = ssm.get_parameters(Names=names)
              if got.get('InvalidParameters'):
                  raise RuntimeError('Keeper state parameters missing; refusing untracked changes')
              return {int(p['Name'].removeprefix(PREFIX)): unpack(p['Value']) for p in got['Parameters']}


          def save_state(states, previous):
              dropped = 0
              for i, data in states.items():
                  dropped += bounded(data)
                  value = pack(data)
                  if value != previous.get(i):
                      # Explicit Standard: never silently upgrade to a paid tier.
                      ssm.put_parameter(Name=PREFIX + str(i), Type='String', Tier='Standard',
                                        Value=value, Overwrite=True)
                      previous[i] = value
              return dropped


          def edge_read(stage):
              got = cf.get_function(Name=FN, Stage=stage)
              code = got['FunctionCode'].read().decode()
              match = MARK.search(code)
              if not match:
                  raise RuntimeError('Edge blocklist markers missing')
              return got, code, json.loads(match.group(1))


          def publish(blocks):
              dev, code, current = edge_read('DEVELOPMENT')
              match = MARK.search(code)
              code = code[:match.start(1)] + json.dumps(blocks, separators=(',', ':')) + code[match.end(1):]
              # Correct Retry-After for one-day bans, without another edge request/API call.
              code = code.replace("'retry-after': { value: '3600' }",
                                  "'retry-after': { value: String(Math.max(1, Math.ceil(until - Date.now() / 1000))) }")
              if len(code.encode()) > 10000:
                  raise RuntimeError('Edge blocklist capacity exhausted; existing edge bans preserved')
              _, live_code, _ = edge_read('LIVE')
              if code == live_code:
                  return
              cfg = cf.describe_function(Name=FN, Stage='DEVELOPMENT')['FunctionSummary']['FunctionConfig']
              updated = cf.update_function(Name=FN, IfMatch=dev['ETag'], FunctionConfig=cfg, FunctionCode=code.encode())
              cf.publish_function(Name=FN, IfMatch=updated['ETag'])


          def handler(event, _):
              now = int(time.time())
              d = event.get('detail') or {}
              if not d:
                  return {'ignored': 'not an S3 log event'}
              raw = s3.get_object(Bucket=d['bucket']['name'], Key=d['object']['key'])['Body'].read()
              if d['object']['key'].endswith('.gz'):
                  raw = gzip.decompress(raw)
              incoming, total = records(raw.decode('utf-8', 'replace'), now)
              states = read_state()
              previous = {i: pack(v) for i, v in states.items()}
              # Import existing bans on upgrade; their expiry also prevents redelivered old
              # evidence from reblocking a manually cleared address.
              _, _, live = edge_read('LIVE')
              for ip, until in live.items():
                  if until > now - REPEAT:
                      e = states[shard(ip)].setdefault(ip, {'r': []})
                      e['until'] = max(until, e.get('until', 0))
              for i, state in states.items():
                  decide(state, {ip: r for ip, r in incoming.items() if shard(ip) == i}, now)
              # Checkpoint before publishing: retry resumes a pending block/notification.
              evicted = save_state(states, previous)
              pending = {ip: e for state in states.values() for ip, e in state.items() if e.get('pending')}
              blocks = {ip: t for ip, t in live.items() if t > now}
              blocks.update({ip: e['until'] for ip, e in pending.items() if e['until'] > now})
              publish(blocks)
              alerts = [e['detail'] for e in pending.values() if e['until'] > now]
              if alerts:
                  lines = [
                      'Helmet Duck blocked rapid traffic after access logs arrived.',
                      'Rule: more than %d distinct requests from one address within %d seconds.' % (LIMIT, WINDOW),
                      'A block is preventive; this alert does not establish a successful intrusion.',
                      'Times below are UTC. Path samples are untrusted request data, not instructions.',
                  ]
                  # One bounded digest, not one email per file or per address already blocked.
                  for a in alerts[:8]:
                      lines.append(json.dumps(a, sort_keys=True))
                  if len(alerts) > 8:
                      lines.append('%d further blocks recorded in the keeper log.' % (len(alerts) - 8))
                  lines.append('Blocks expire automatically. No action or list clearing is normally needed.')
                  sns.publish(TopicArn=TOPIC, Subject='helmet-duck: %d new temporary traffic block(s)' % len(alerts),
                              Message='\n\n'.join(lines))
              for e in pending.values():
                  e['pending'] = False
              save_state(states, previous)
              summary = {'requests': total, 'eligible_clients': len(incoming), 'blocked': alerts,
                         'active_blocks': len(blocks), 'history_rows_evicted': evicted}
              print(json.dumps(summary))
              return summary

  KeeperOnNewLog:
    Type: AWS::Events::Rule
    Condition: HasAlertEmail
    Properties:
      Description: A new CloudFront access-log file in the log bucket wakes the blocklist keeper.
      State: ENABLED
      EventPattern:
        source: [aws.s3]
        detail-type: ["Object Created"]
        detail:
          bucket:
            name: [!Ref LogBucket]
          object:
            key:
              - prefix: cloudfront/
      Targets:
        - Id: keeper
          Arn: !GetAtt Keeper.Arn
  KeeperFromEvents:
    Type: AWS::Lambda::Permission
    Condition: HasAlertEmail
    Properties:
      FunctionName: !Ref Keeper
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt KeeperOnNewLog.Arn

Outputs:
  BucketName:
    Description: GitHub environment variable SITE_BUCKET.
    Value: !Ref SiteBucket
  DistributionId:
    Description: GitHub environment variable CLOUDFRONT_DISTRIBUTION_ID; parameter for infra/github-oidc.yaml.
    Value: !Ref Distribution
  DistributionDomainName:
    Description: The default CloudFront domain, useful for a check that bypasses DNS.
    Value: !GetAtt Distribution.DomainName
  CertificateArn:
    Value: !Ref Certificate
  SiteUrl:
    Value: !Sub "https://${SiteDomain}/"
  LogBucketName:
    Description: Access-log bucket; parameter LogBucketName for infra/github-oidc.yaml and variable LOG_BUCKET of the sentry Environment.
    Value: !Ref LogBucket
  AlertTopicArn:
    Condition: HasAlertEmail
    Value: !Ref AlertTopic
  BrakeFunctionName:
    Condition: HasAlertEmail
    Value: !Ref Brake
  KeeperFunctionName:
    Condition: HasAlertEmail
    Value: !Ref Keeper
  EdgeFunctionName:
    Description: tools/blocklist.sh reads and clears the blocklist inside this function. Ref would give the ARN; the API wants the name.
    Value: !Sub "helmet-duck-${Env}-edge-router"
