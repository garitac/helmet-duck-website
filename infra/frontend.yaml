AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  helmetduck.com static site: ACM certificate (DNS-validated in the hosted zone),
  private S3 origin, CloudFront with Origin Access Control, security headers with a
  strict CSP, an edge router (www to apex, directory index, honest 404), and Route 53
  alias records, access logs for the sentry, DNS hygiene records (CAA, MX, SPF, DMARC;
  pointing at SES when infra/mail.yaml is applied) and, when an alert email is given, a monthly budget alert and a request-flood
  alarm with a brake that disables the distribution while a flood lasts. Apply in us-east-1 only: CloudFront reads certificates from that region and
  from nowhere else.

# One stack, one environment (prod). The bucket is PRIVATE (all public access
# blocked) and readable only by this distribution through OAC. Deploys never
# delete: the deploy role has no s3:DeleteObject, and versioning keeps 90 days
# of rollback.
#
#   aws cloudformation deploy --template-file infra/frontend.yaml \
#     --stack-name helmet-duck-frontend-prod \
#     --parameter-overrides SiteDomain=helmetduck.com HostedZoneId=Z... \
#     --region us-east-1 --profile <admin profile>

Parameters:
  SiteDomain:
    Type: String
    Default: helmetduck.com
    Description: Apex domain. www.<SiteDomain> is also served and redirects to the apex.
  HostedZoneId:
    Type: String
    AllowedPattern: "^Z[A-Z0-9]+$"
    Description: Route 53 public hosted zone id for SiteDomain (certificate validation + alias records).
  Env:
    Type: String
    Default: prod
    AllowedValues: [prod]
  AlertEmail:
    Type: String
    Default: ""
    Description: >-
      Email for the monthly budget alert and the request-flood alarm. Empty creates
      neither. Supplied at apply time (HELMET_DUCK_ALERT_EMAIL); never committed.
  MonthlyBudgetUsd:
    Type: Number
    Default: 5
    MinValue: 1
    Description: Monthly cost budget for the whole account, in USD; alerts at 80% actual and 100% forecast.
  HourlyRequestAlarm:
    Type: Number
    Default: 100000
    MinValue: 1000
    Description: CloudFront requests in one hour that trip the flood alarm. A quiet new site sees a few hundred.

  MailProvider:
    Type: String
    Default: none
    AllowedValues: [none, ses]
    Description: >-
      none: the zone says the domain sends and receives no mail (null MX, SPF fail-all).
      ses: the apex MX and SPF point at Amazon SES; the identity, DKIM, MAIL FROM records,
      receipt rule and forwarder live in infra/mail.yaml. tools/apply.sh sets this.

Conditions:
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, ""]]
  HasMail: !Equals [!Ref MailProvider, ses]

Resources:

  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref SiteDomain
      SubjectAlternativeNames:
        - !Sub "www.${SiteDomain}"
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref SiteDomain
          HostedZoneId: !Ref HostedZoneId
        - DomainName: !Sub "www.${SiteDomain}"
          HostedZoneId: !Ref HostedZoneId
      Tags:
        - { Key: Project, Value: helmet-duck }
        - { Key: Environment, Value: !Ref Env }
        - { Key: ManagedBy, Value: cloudformation }

  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "helmet-duck-${Env}-site-${AWS::AccountId}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-versions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 90
      Tags:
        - { Key: Project, Value: helmet-duck }
        - { Key: Environment, Value: !Ref Env }
        - { Key: ManagedBy, Value: cloudformation }

  # Access logs: the sentry's raw material. CloudFront's standard logging writes
  # through an ACL grant, so this bucket keeps ACLs enabled (BucketOwnerPreferred)
  # while every public grant stays blocked. Logs expire after 90 days. Only the
  # read-only sentry role (infra/github-oidc.yaml) and the account read them.
  LogBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "helmet-duck-${Env}-logs-${AWS::AccountId}"
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerPreferred
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: expire-logs
            Status: Enabled
            ExpirationInDays: 90
          - Id: abort-incomplete-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      Tags:
        - { Key: Project, Value: helmet-duck }
        - { Key: Environment, Value: !Ref Env }
        - { Key: ManagedBy, Value: cloudformation }

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "helmet-duck-${Env}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # The page ships no JavaScript and no third-party assets, so the policy can be
  # strict. If a script or an external resource is ever added, this is the line
  # that must change first, deliberately.
  SecurityHeaders:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "helmet-duck-${Env}-security-headers"
        Comment: Strict headers for a static, script-free site.
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            ContentSecurityPolicy: "default-src 'none'; style-src 'self'; img-src 'self' data:; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests"
            Override: true
          ContentTypeOptions: { Override: true }
          FrameOptions: { FrameOption: DENY, Override: true }
          ReferrerPolicy: { ReferrerPolicy: strict-origin-when-cross-origin, Override: true }
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Preload: true
            Override: true
        CustomHeadersConfig:
          Items:
            - Header: Permissions-Policy
              Value: "geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=()"
              Override: true

  # www -> apex (301), directory index, and an honest 404 for unknown routes:
  # an extensionless path becomes <path>/index.html and 404s if absent. It is
  # never masked to the home page.
  EdgeRouter:
    Type: AWS::CloudFront::Function
    Properties:
      AutoPublish: true
      Name: !Sub "helmet-duck-${Env}-edge-router"
      FunctionConfig:
        Comment: www to apex, directory index, honest 404.
        Runtime: cloudfront-js-2.0
      FunctionCode: !Sub |
        function handler(event) {
          var request = event.request;
          var host = request.headers.host ? request.headers.host.value : '';
          var uri = request.uri;
          if (host === 'www.${SiteDomain}') {
            return { statusCode: 301, statusDescription: 'Moved Permanently',
                     headers: { location: { value: 'https://${SiteDomain}' + uri } } };
          }
          if (uri.endsWith('/')) {
            request.uri = uri + 'index.html';
          } else if (!uri.split('/').pop().includes('.')) {
            request.uri = uri + '/index.html';
          }
          return request;
        }

  Distribution:
    Type: AWS::CloudFront::Distribution
    DependsOn: Certificate
    Properties:
      DistributionConfig:
        Comment: !Sub "helmet-duck ${Env} (${SiteDomain})"
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_All
        IPV6Enabled: true
        Logging:
          Bucket: !GetAtt LogBucket.DomainName
          Prefix: cloudfront/
          IncludeCookies: false
        Aliases:
          - !Ref SiteDomain
          - !Sub "www.${SiteDomain}"
        Origins:
          - Id: s3origin
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !Ref OriginAccessControl
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: s3origin
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6   # AWS managed CachingOptimized
          ResponseHeadersPolicyId: !Ref SecurityHeaders
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt EdgeRouter.FunctionARN
        CustomErrorResponses:
          # A private bucket answers 403 for a missing key. Both become an honest
          # 404 page with a 404 status, never a masked home page.
          - { ErrorCode: 403, ResponseCode: 404, ResponsePagePath: /404.html, ErrorCachingMinTTL: 0 }
          - { ErrorCode: 404, ResponseCode: 404, ResponsePagePath: /404.html, ErrorCachingMinTTL: 0 }
        ViewerCertificate:
          AcmCertificateArn: !Ref Certificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
      Tags:
        - { Key: Project, Value: helmet-duck }
        - { Key: Environment, Value: !Ref Env }

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontOACRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  # Z2FDTNDATAQYW2 is CloudFront's fixed alias hosted-zone id, the same for every distribution.
  ApexA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref SiteDomain
      Type: A
      AliasTarget: { DNSName: !GetAtt Distribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2, EvaluateTargetHealth: false }
  ApexAAAA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref SiteDomain
      Type: AAAA
      AliasTarget: { DNSName: !GetAtt Distribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2, EvaluateTargetHealth: false }
  WwwA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub "www.${SiteDomain}"
      Type: A
      AliasTarget: { DNSName: !GetAtt Distribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2, EvaluateTargetHealth: false }
  WwwAAAA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub "www.${SiteDomain}"
      Type: AAAA
      AliasTarget: { DNSName: !GetAtt Distribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2, EvaluateTargetHealth: false }

  # Certificate authority authorization: only Amazon's CAs may issue for this name.
  ApexCAA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref SiteDomain
      Type: CAA
      TTL: "3600"
      ResourceRecords:
        - '0 issue "amazon.com"'
        - '0 issue "amazontrust.com"'
        - '0 issue "awstrust.com"'
        - '0 issue "amazonaws.com"'

  # Mail. With MailProvider=none the zone says the domain sends and receives no
  # mail, so nobody can send mail as it: a null MX, an SPF that fails every sender,
  # a DMARC that rejects. With MailProvider=ses the MX and SPF point at Amazon SES,
  # whose identity, DKIM and MAIL FROM records are created by infra/mail.yaml. DMARC
  # stays at reject in both cases: SES signs with DKIM aligned to this domain and the
  # MAIL FROM subdomain aligns SPF, which is what DMARC needs.
  ApexMX:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref SiteDomain
      Type: MX
      TTL: "3600"
      ResourceRecords:
        - !If [HasMail, !Sub "10 inbound-smtp.${AWS::Region}.amazonaws.com.", "0 ."]
  ApexTXT:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref SiteDomain
      Type: TXT
      TTL: "3600"
      ResourceRecords:
        - !If [HasMail, '"v=spf1 include:amazonses.com -all"', '"v=spf1 -all"']
  DmarcTXT:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub "_dmarc.${SiteDomain}"
      Type: TXT
      TTL: "3600"
      ResourceRecords:
        - '"v=DMARC1; p=reject; sp=reject; adkim=s; aspf=s"'
  # Money watch, created only when an alert email is given. The budget is free
  # (the first two budgets in an account are). The alarm is the one paid line in
  # this template: about 0.10 USD a month.
  AlertTopic:
    Type: AWS::SNS::Topic
    Condition: HasAlertEmail
    Properties:
      TopicName: !Sub "helmet-duck-${Env}-alerts"
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlertEmail
  RequestFloodAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasAlertEmail
    Properties:
      AlarmName: !Sub "helmet-duck-${Env}-request-flood"
      AlarmDescription: More CloudFront requests in one hour than a quiet static site should see. A cost attack or a viral hour; look, then decide.
      Namespace: AWS/CloudFront
      MetricName: Requests
      Dimensions:
        - { Name: DistributionId, Value: !Ref Distribution }
        - { Name: Region, Value: Global }
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: !Ref HourlyRequestAlarm
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic
  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Condition: HasAlertEmail
    Properties:
      # No fixed BudgetName: changing a subscriber replaces the budget, and a replacement
      # with a fixed name collides with the one it replaces. CloudFormation names it.
      Budget:
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref MonthlyBudgetUsd
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - { SubscriptionType: EMAIL, Address: !Ref AlertEmail }
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - { SubscriptionType: EMAIL, Address: !Ref AlertEmail }

  # The brake. When the flood alarm fires, this function disables the distribution
  # and waits: an hour the first time, twice as long each repeat, a day at most,
  # resetting after a quiet day. A scheduled tick re-enables it when the wait is
  # over. It bounds the bill; it does not keep the site up. The owner can release
  # it early or switch it off: tools/brake.sh. Free at this volume.
  BrakeState:
    Type: AWS::SSM::Parameter
    Condition: HasAlertEmail
    Properties:
      Name: !Sub "/helmet-duck/${Env}/brake"
      Type: String
      Value: '{"count": 0}'
      Description: helmet-duck brake state (count, last_alarm, until, off). Written by the brake function and tools/brake.sh.
  BrakeRole:
    Type: AWS::IAM::Role
    Condition: HasAlertEmail
    Properties:
      Description: The brake may read and toggle this one distribution, keep its state, and notify the alert topic.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: brake
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - cloudfront:GetDistributionConfig
                  - cloudfront:UpdateDistribution
                Resource: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:PutParameter
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/helmet-duck/${Env}/brake"
              - Effect: Allow
                Action: sns:Publish
                Resource: !Ref AlertTopic
  Brake:
    Type: AWS::Lambda::Function
    Condition: HasAlertEmail
    Properties:
      Description: Disables the helmetduck.com distribution when the flood alarm fires; re-enables it after a growing wait.
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt BrakeRole.Arn
      Timeout: 30
      MemorySize: 128
      Environment:
        Variables:
          DISTRIBUTION_ID: !Ref Distribution
          PARAM: !Sub "/helmet-duck/${Env}/brake"
          TOPIC: !Ref AlertTopic
          ALARM_NAME: !Sub "helmet-duck-${Env}-request-flood"
      Code:
        ZipFile: |
          import json, os, time
          import boto3
          cf, ssm, sns = boto3.client("cloudfront"), boto3.client("ssm"), boto3.client("sns")
          DIST, PARAM, TOPIC, ALARM = (os.environ[k] for k in ("DISTRIBUTION_ID", "PARAM", "TOPIC", "ALARM_NAME"))
          BASE, CAP, QUIET = 3600, 86400, 86400

          def state():
              try:
                  return json.loads(ssm.get_parameter(Name=PARAM)["Parameter"]["Value"])
              except Exception:
                  return {}

          def save(s):
              ssm.put_parameter(Name=PARAM, Value=json.dumps(s), Type="String", Overwrite=True)

          def set_enabled(on):
              r = cf.get_distribution_config(Id=DIST)
              cfg = r["DistributionConfig"]
              if cfg["Enabled"] == on:
                  return False
              cfg["Enabled"] = on
              cf.update_distribution(Id=DIST, IfMatch=r["ETag"], DistributionConfig=cfg)
              return True

          def say(subject, body):
              sns.publish(TopicArn=TOPIC, Subject=subject[:99], Message=body)

          def when(ts):
              return time.strftime("%Y-%m-%d %H:%M UTC", time.gmtime(ts))

          def handler(event, _):
              now = int(time.time())
              s = state()
              if s.get("off"):
                  print("brake switched off by the owner; nothing done")
                  return
              for rec in event.get("Records", []):
                  try:
                      m = json.loads(rec["Sns"]["Message"])
                  except Exception:
                      continue
                  if m.get("AlarmName") != ALARM or m.get("NewStateValue") != "ALARM":
                      continue
                  if now - s.get("last_alarm", 0) > QUIET:
                      s["count"] = 0
                  s["count"] = s.get("count", 0) + 1
                  s["last_alarm"] = now
                  wait = min(BASE * 2 ** (s["count"] - 1), CAP)
                  s["until"] = now + wait
                  changed = set_enabled(False)
                  save(s)
                  say("helmet-duck brake engaged", "The flood alarm fired (%d in a row). Distribution %s is disabled for %d minutes, until %s. Release early with tools/brake.sh release." % (s["count"], DIST, wait // 60, when(s["until"])))
                  print(json.dumps({"brake": "engaged", "count": s["count"], "until": s["until"], "changed": changed}))
                  return
              if event.get("tick") and s.get("until") and now >= s["until"]:
                  changed = set_enabled(True)
                  s["until"] = 0
                  save(s)
                  if changed:
                      say("helmet-duck brake released", "Distribution %s is enabled again at %s. If the flood continues the alarm fires again and the next wait is longer (%d in a row so far)." % (DIST, when(now), s.get("count", 0)))
                  print(json.dumps({"brake": "released", "changed": changed}))
  BrakeFromTopic:
    Type: AWS::Lambda::Permission
    Condition: HasAlertEmail
    Properties:
      FunctionName: !Ref Brake
      Action: lambda:InvokeFunction
      Principal: sns.amazonaws.com
      SourceArn: !Ref AlertTopic
  BrakeSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      TopicArn: !Ref AlertTopic
      Protocol: lambda
      Endpoint: !GetAtt Brake.Arn
  BrakeTick:
    Type: AWS::Events::Rule
    Condition: HasAlertEmail
    Properties:
      Description: Every fifteen minutes the brake checks whether its wait is over.
      ScheduleExpression: rate(15 minutes)
      State: ENABLED
      Targets:
        - Id: brake
          Arn: !GetAtt Brake.Arn
          Input: '{"tick": true}'
  BrakeFromTick:
    Type: AWS::Lambda::Permission
    Condition: HasAlertEmail
    Properties:
      FunctionName: !Ref Brake
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt BrakeTick.Arn

Outputs:
  BucketName:
    Description: GitHub environment variable SITE_BUCKET.
    Value: !Ref SiteBucket
  DistributionId:
    Description: GitHub environment variable CLOUDFRONT_DISTRIBUTION_ID; parameter for infra/github-oidc.yaml.
    Value: !Ref Distribution
  DistributionDomainName:
    Description: The default CloudFront domain, useful for a check that bypasses DNS.
    Value: !GetAtt Distribution.DomainName
  CertificateArn:
    Value: !Ref Certificate
  SiteUrl:
    Value: !Sub "https://${SiteDomain}/"
  LogBucketName:
    Description: Access-log bucket; parameter LogBucketName for infra/github-oidc.yaml and variable LOG_BUCKET of the sentry Environment.
    Value: !Ref LogBucket
  AlertTopicArn:
    Condition: HasAlertEmail
    Value: !Ref AlertTopic
  BrakeFunctionName:
    Condition: HasAlertEmail
    Value: !Ref Brake
