# environments/prod.env.yaml - helmetduck.com PROD environment contract.
#
# Source of truth for the deploy targets. The deploy workflow reads the same
# values from the `prod` GitHub Environment variables (AWS_DEPLOY_ROLE_ARN,
# SITE_BUCKET, CLOUDFRONT_DISTRIBUTION_ID); tools/apply.sh sets both at once.
#
# STATUS: PLANNED until tools/apply.sh has run; it fills the values below. Values
# marked PLANNED again wait for the next apply (log bucket, sentry role, alerts).

env: prod
status: CREATED

aws:
  account_id: "244206438585"
  region: us-east-1            # CloudFront certificates live here; the whole stack does too

domain:
  site: "helmetduck.com"
  aliases: ["helmetduck.com", "www.helmetduck.com"]   # www redirects to the apex at the edge
  route53_hosted_zone_id: "Z01297912PL6MNLDM2HGQ"
  acm: "created by infra/frontend.yaml in us-east-1, DNS-validated in the hosted zone"

frontend:
  cloudformation_stack: "helmet-duck-frontend-prod"
  bucket: "helmet-duck-prod-site-244206438585"
  cloudfront_distribution: "E1A88GWV0VC9UE"
  cloudfront_domain: "d410w5h13yasn.cloudfront.net"
  log_bucket: "helmet-duck-prod-logs-244206438585"
  alerts: "configured"

mail:
  provider: "ses"
  dkim_selectors: ["pyihr4mnjvs2kactuds6xbbfv62y4ipg", "elldzi2falcgtj5tsm5gjw3nfrsn6cvp", "riu4wtxncsc7urcgv77uv6dzsrrkljb5"]
  sender: "hello@helmetduck.com"

deploy:
  cloudformation_stack: "helmet-duck-github-oidc"
  role_arn: "arn:aws:iam::244206438585:role/helmet-duck-prod-deploy"
  sentry_role_arn: "arn:aws:iam::244206438585:role/helmet-duck-sentry"
  how: "GitHub Actions -> Deploy (helmetduck.com) -> dry_run=true first, then false (OIDC, no --delete)"
